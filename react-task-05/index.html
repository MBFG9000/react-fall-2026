<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/compass.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <meta name="description" content="Crew roster and dashboard for the research vessel Meridian.">
    <title>Meridian Crew</title>
    <script>
        // GitHub Pages deep-link fallback (see gh-pages-404.html): the site 404 page
        // sent us here as ?__spa=/crew/3. Restore the real URL before the router starts.
        (function () {
            var spaPath = new URLSearchParams(window.location.search).get('__spa');
            if (spaPath !== null) {
                window.history.replaceState(null, '', window.location.pathname.replace(/\/$/, '') + spaPath);
            }
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
