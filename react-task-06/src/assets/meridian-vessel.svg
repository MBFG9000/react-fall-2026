<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t">
  <title id="t">The research vessel Meridian passing a ringed planet</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1530"/>
      <stop offset="1" stop-color="#263a8a"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffd6a3"/>
      <stop offset="0.55" stop-color="#e2804f"/>
      <stop offset="1" stop-color="#7a3326"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fb"/>
      <stop offset="1" stop-color="#aab4cc"/>
    </linearGradient>
    <linearGradient id="engine" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#8fd3ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8fd3ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" rx="24" fill="url(#sky)"/>

  <g fill="#fff">
    <circle cx="40" cy="50" r="1.4" opacity="0.8"/>
    <circle cx="118" cy="96" r="1" opacity="0.6"/>
    <circle cx="190" cy="34" r="1.6" opacity="0.9"/>
    <circle cx="260" cy="120" r="1" opacity="0.5"/>
    <circle cx="330" cy="58" r="1.3" opacity="0.8"/>
    <circle cx="402" cy="26" r="1" opacity="0.6"/>
    <circle cx="590" cy="64" r="1.5" opacity="0.9"/>
    <circle cx="612" cy="180" r="1" opacity="0.6"/>
    <circle cx="70" cy="210" r="1.2" opacity="0.7"/>
    <circle cx="36" cy="330" r="1.5" opacity="0.8"/>
    <circle cx="150" cy="380" r="1" opacity="0.5"/>
    <circle cx="300" cy="360" r="1.3" opacity="0.7"/>
    <circle cx="560" cy="380" r="1.1" opacity="0.6"/>
    <circle cx="480" cy="300" r="1" opacity="0.5"/>
  </g>

  <!-- ringed planet -->
  <g transform="translate(470 150)">
    <ellipse rx="150" ry="30" fill="none" stroke="#f3c79a" stroke-opacity="0.35" stroke-width="10" transform="rotate(-14)"/>
    <circle r="92" fill="url(#planet)"/>
    <path d="M-90 -12c50 14 120 10 178 -8M-82 30c56 12 112 8 160 -10" stroke="#7a3326" stroke-opacity="0.35" stroke-width="7" fill="none"/>
    <path d="M-148 34a150 30 -14 0 0 296 -68" fill="none" stroke="#f3c79a" stroke-opacity="0.6" stroke-width="10" transform="rotate(0)"/>
  </g>

  <!-- the ship -->
  <g transform="translate(110 250) rotate(-8)">
    <path d="M-80 0h70" stroke="url(#engine)" stroke-width="16" stroke-linecap="round"/>
    <path d="M-60 -22h44" stroke="url(#engine)" stroke-width="8" stroke-linecap="round"/>
    <path d="M-60 22h44" stroke="url(#engine)" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 -14h170c40 0 70 6 92 14c-22 8 -52 14 -92 14H0z" fill="url(#hull)"/>
    <path d="M20 -14l40 -26h60l-20 26zM20 14l40 26h60l-20 -26z" fill="#c4ccdf"/>
    <rect x="-16" y="-30" width="22" height="16" rx="4" fill="#d5dbe8"/>
    <rect x="-16" y="14" width="22" height="16" rx="4" fill="#d5dbe8"/>
    <rect x="-8" y="-10" width="14" height="20" rx="3" fill="#8fa0c4"/>
    <g fill="#3b5bdb">
      <circle cx="140" cy="0" r="3.5"/>
      <circle cx="160" cy="0" r="3.5"/>
      <circle cx="180" cy="0" r="3.5"/>
      <circle cx="200" cy="0" r="3.5"/>
    </g>
    <path d="M232 -6c10 2 18 4 24 6c-6 2 -14 4 -24 6z" fill="#3b5bdb"/>
  </g>
</svg>
