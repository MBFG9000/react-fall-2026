<!doctype html>
<!--
  Site-wide 404 page for GitHub Pages (copied to the site root by
  .github/workflows/deploy.yml). GitHub Pages only uses a 404.html at the
  root, so deep links into the SPAs (e.g. /react-fall-2026/react-task-06/crew/3)
  end up here on refresh. For those paths we bounce to the app's index.html with
  the original path in ?__spa=…; a small script in index.html puts the real URL
  back before React Router reads it. Every other path gets a normal 404.
  Task 05 and Task 06 both use this, so the list below has both apps.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Page not found</title>
    <script>
        (function () {
            var apps = ['/react-fall-2026/react-task-05', '/react-fall-2026/react-task-06'];
            var path = window.location.pathname;
            for (var i = 0; i < apps.length; i++) {
                var app = apps[i];
                if (path.indexOf(app + '/') === 0) {
                    var rest = path.slice(app.length) + window.location.search + window.location.hash;
                    window.location.replace(app + '/?__spa=' + encodeURIComponent(rest));
                    return;
                }
            }
        })();
    </script>
    <style>
        body { font-family: system-ui, sans-serif; text-align: center; padding: 15vh 16px; color: #161b2e; background: #eef1f6; }
        a { color: #3b5bdb; }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>This page does not exist.</p>
    <p><a href="/react-fall-2026/">Back to React Fall 2026</a></p>
</body>
</html>
