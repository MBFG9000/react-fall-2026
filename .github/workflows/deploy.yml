name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            react-task-02/package-lock.json
            react-task-03/package-lock.json
            react-task-04/package-lock.json
            react-task-05/package-lock.json
            react-task-06/package-lock.json

      - name: Build react-task-02
        working-directory: react-task-02
        run: |
          npm ci
          npm run build

      - name: Build react-task-03
        working-directory: react-task-03
        run: |
          npm ci
          npm run build

      - name: Build react-task-04
        working-directory: react-task-04
        run: |
          npm ci
          npm run build

      - name: Build react-task-05
        working-directory: react-task-05
        run: |
          npm ci
          npm run build

      # .env.local is not in git, so the Firebase config comes from the repo's
      # Settings → Secrets and variables → Actions. Vite reads these at build time.
      - name: Build react-task-06
        working-directory: react-task-06
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r react-task-00 _site/react-task-00
          cp -r react-task-01 _site/react-task-01
          cp -r react-task-02/dist _site/react-task-02
          cp -r react-task-03/dist _site/react-task-03
          cp -r react-task-04/dist _site/react-task-04
          cp -r react-task-05/dist _site/react-task-05
          cp -r react-task-06/dist _site/react-task-06
          # Site-wide 404 page: lets Task 05 and Task 06 deep links survive a refresh
          cp react-task-06/gh-pages-404.html _site/404.html
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>React Fall 2026</title>
          <h1>React Fall 2026</h1>
          <ul>
            <li><a href="react-task-00/">Task 00</a></li>
            <li><a href="react-task-01/">Task 01</a></li>
            <li><a href="react-task-02/">Task 02 — About Me (React)</a></li>
            <li><a href="react-task-03/">Task 03 — Glasshouse (Rendering and State)</a></li>
            <li><a href="react-task-04/">Task 04 — Meridian Crew Roster (Effects &amp; API)</a></li>
            <li><a href="react-task-05/">Task 05 — Meridian Crew (Routing &amp; Architecture)</a></li>
            <li><a href="react-task-06/">Task 06 — Meridian Crew (Caching &amp; Firebase Auth)</a></li>
          </ul>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
